<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drilearn turns notes, PDFs, YouTube videos and lectures into quizzes, flashcards and study notes." />
    <title>Drilearn</title>
    <script>
      // Apply the theme before React renders to prevent a flash:
      // the saved choice first, otherwise the operating system setting.
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('driquiz_theme') ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
